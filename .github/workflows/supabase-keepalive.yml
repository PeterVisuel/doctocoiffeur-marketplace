# Visite quotidienne de la base Supabase, pour éviter la mise en pause automatique de l'offre gratuite
# (un projet sans activité pendant environ 7 jours est mis en pause).
# À retirer une fois Supabase passé en offre Pro (plus de pause).
#
# Réglage nécessaire (une fois) : GitHub › Settings › Secrets and variables › Actions › New repository secret
#   SUPABASE_ANON_KEY = la clé publique Supabase (la même que REACT_APP_SUPABASE_ANON_KEY dans Vercel)

name: Visite quotidienne Supabase

on:
  schedule:
    - cron: '17 6 * * *' # chaque jour vers 7 h ou 8 h (heure de Paris)
  workflow_dispatch: # bouton « Run workflow » pour tester à la main

permissions:
  contents: read

jobs:
  visite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lire un salon dans la base
        env:
          SUPABASE_URL: https://mgzbtwhlsmpfyegothxb.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secret SUPABASE_ANON_KEY manquant (GitHub › Settings › Secrets and variables › Actions)"
            exit 1
          fi
          status=$(curl -sS -o /tmp/reponse.json -w '%{http_code}' --retry 3 --retry-delay 20 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/prestataires?select=id&limit=1")
          echo "Réponse de Supabase : $status"
          if [ "$status" != "200" ]; then
            cat /tmp/reponse.json
            echo "::error::Supabase n'a pas répondu normalement (projet en pause ou clé incorrecte ?)"
            exit 1
          fi
